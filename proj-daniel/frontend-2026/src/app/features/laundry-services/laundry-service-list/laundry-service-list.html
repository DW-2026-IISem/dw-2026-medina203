<app-page-header
  title="Servicios"
  subtitle="Lo que cobra la lavandería por tipo de prenda: por kilogramo o por unidad."
>
  <p-tag [value]="rows().length + ' activos'" severity="info" [rounded]="true" />
  <button pButton type="button" (click)="openCreate()">
    <i pButtonIcon class="pi pi-plus"></i>
    <span pButtonLabel>Nuevo servicio</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<div class="rounded-xl border border-slate-200 bg-white">
  <p-table
    [value]="visibleRows()"
    [loading]="loading()"
    [paginator]="visibleRows().length > 10"
    [rows]="10"
    dataKey="id"
    tableStyleClass="min-w-3xl"
  >
    <ng-template #caption>
      <div class="grid gap-2 sm:grid-cols-[1fr_16rem]">
        <div class="flex items-center gap-2">
          <i class="pi pi-search text-slate-400"></i>
          <input
            pInputText
            type="search"
            aria-label="Buscar servicios"
            placeholder="Buscar por nombre, descripción o prenda…"
            [value]="filter()"
            (input)="filter.set($any($event.target).value)"
            class="w-full"
          />
        </div>
        <p-select
          ariaLabel="Filtrar por tipo de prenda"
          [options]="garmentTypes()"
          optionLabel="name"
          optionValue="id"
          [showClear]="true"
          placeholder="Todos los tipos de prenda"
          [ngModel]="garmentTypeFilter()"
          (ngModelChange)="garmentTypeFilter.set($event)"
          [fluid]="true"
        />
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="name">
          <div class="flex items-center gap-1">Servicio <p-sort-icon field="name" /></div>
        </th>
        <th>Tipo de prenda</th>
        <th pSortableColumn="price" class="text-right">
          <div class="flex items-center justify-end gap-1">
            Precio <p-sort-icon field="price" />
          </div>
        </th>
        <th class="text-right">Entrega</th>
        <th>Estado</th>
        <th class="w-40 text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-service>
      <tr>
        <td>
          <p class="font-medium text-slate-800">{{ service.name }}</p>
          <p class="text-xs text-slate-400">{{ service.description || '#' + service.id }}</p>
        </td>
        <td>
          <p-tag [value]="service.garment_type?.name ?? '—'" severity="secondary" />
        </td>
        <td class="text-right">
          <p class="font-medium text-slate-800">{{ service.price | cop }}</p>
          <p class="text-xs text-slate-400">{{ unitLabel(service) }}</p>
        </td>
        <td class="text-right text-sm text-slate-600">{{ service.estimated_hours }} h</td>
        <td><app-status-tag [status]="service.status" /></td>
        <td>
          <div class="flex justify-end gap-1">
            <button
              pButton
              type="button"
              text
              rounded
              severity="secondary"
              aria-label="Editar servicio"
              pTooltip="Editar"
              (click)="openEdit(service)"
            >
              <i pButtonIcon class="pi pi-pencil"></i>
            </button>
            <button
              pButton
              type="button"
              text
              rounded
              severity="warn"
              aria-label="Desactivar servicio"
              pTooltip="Baja lógica"
              (click)="deactivate(service)"
            >
              <i pButtonIcon class="pi pi-ban"></i>
            </button>
            <button
              pButton
              type="button"
              text
              rounded
              severity="danger"
              aria-label="Eliminar servicio"
              pTooltip="Eliminar"
              (click)="remove(service)"
            >
              <i pButtonIcon class="pi pi-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="6">
          <app-empty-state
            icon="pi pi-sparkles"
            [title]="filter() || garmentTypeFilter() ? 'Sin coincidencias' : 'Sin servicios'"
            [message]="
              filter() || garmentTypeFilter()
                ? 'Ningún servicio coincide con los filtros.'
                : 'Crea el primer servicio o ejecuta el seeder del backend.'
            "
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  styleClass="w-full max-w-2xl mx-4"
>
  <app-laundry-service-form
    [service]="editing()"
    [garmentTypes]="garmentTypes()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>
