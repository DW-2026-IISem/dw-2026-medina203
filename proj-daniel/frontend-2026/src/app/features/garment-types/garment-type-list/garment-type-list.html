<app-page-header
  title="Tipos de prenda"
  subtitle="Catálogo de prendas que procesa la planta. Cada servicio de lavado pertenece a un tipo."
>
  <p-tag [value]="rows().length + ' activos'" severity="info" [rounded]="true" />
  <ng-container *appHasPermission="'POST /api/tipos-prenda'">
    <button pButton type="button" (click)="openCreate()">
      <i pButtonIcon class="pi pi-plus"></i>
      <span pButtonLabel>Nuevo tipo</span>
    </button>
  </ng-container>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<div class="rounded-xl border border-slate-200 bg-white">
  <p-table
    [value]="visibleRows()"
    [loading]="loading()"
    [paginator]="visibleRows().length > 10"
    [rows]="10"
    dataKey="id"
    tableStyleClass="min-w-2xl"
  >
    <ng-template #caption>
      <div class="flex items-center gap-2">
        <i class="pi pi-search text-slate-400"></i>
        <input
          pInputText
          type="search"
          aria-label="Buscar tipos de prenda"
          placeholder="Buscar por nombre o descripción…"
          [value]="filter()"
          (input)="filter.set($any($event.target).value)"
          class="w-full"
        />
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="name">
          <div class="flex items-center gap-1">Nombre <p-sort-icon field="name" /></div>
        </th>
        <th>Descripción</th>
        <th>Estado</th>
        <th class="w-40 text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-garmentType>
      <tr>
        <td>
          <p class="font-medium text-slate-800">{{ garmentType.name }}</p>
          <p class="text-xs text-slate-400">#{{ garmentType.id }}</p>
        </td>
        <td class="text-sm text-slate-600">{{ garmentType.description || '—' }}</td>
        <td><app-status-tag [status]="garmentType.status" /></td>
        <td>
          <div class="flex justify-end gap-1">
            <ng-container *appHasPermission="'PATCH /api/tipos-prenda/:id'">
              <button
                pButton
                type="button"
                text
                rounded
                severity="secondary"
                aria-label="Editar tipo de prenda"
                pTooltip="Editar"
                (click)="openEdit(garmentType)"
              >
                <i pButtonIcon class="pi pi-pencil"></i>
              </button>
            </ng-container>
            <ng-container *appHasPermission="'PATCH /api/tipos-prenda/:id/deactivate'">
              <button
                pButton
                type="button"
                text
                rounded
                severity="warn"
                aria-label="Desactivar tipo de prenda"
                pTooltip="Baja lógica"
                (click)="deactivate(garmentType)"
              >
                <i pButtonIcon class="pi pi-ban"></i>
              </button>
            </ng-container>
            <ng-container *appHasPermission="'DELETE /api/tipos-prenda/:id'">
              <button
                pButton
                type="button"
                text
                rounded
                severity="danger"
                aria-label="Eliminar tipo de prenda"
                pTooltip="Eliminar"
                (click)="remove(garmentType)"
              >
                <i pButtonIcon class="pi pi-trash"></i>
              </button>
            </ng-container>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4">
          <app-empty-state
            icon="pi pi-tags"
            [title]="filter() ? 'Sin coincidencias' : 'Sin tipos de prenda'"
            [message]="
              filter()
                ? 'Ningún tipo coincide con la búsqueda.'
                : 'Crea el primero (sábanas, toallas, uniformes…) o ejecuta el seeder.'
            "
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  styleClass="w-full max-w-lg mx-4"
>
  <app-garment-type-form
    [garmentType]="editing()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>
