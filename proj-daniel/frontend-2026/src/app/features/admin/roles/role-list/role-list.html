<app-page-header
  title="Roles"
  subtitle="Los roles agrupan permisos. El nombre se guarda en MAYÚSCULAS."
>
  <p-tag [value]="rows().length + ' totales'" severity="info" [rounded]="true" />
  <ng-container *appHasPermission="'POST /api/roles'">
    <button pButton type="button" (click)="openCreate()">
      <i pButtonIcon class="pi pi-plus"></i><span pButtonLabel>Nuevo rol</span>
    </button>
  </ng-container>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<div class="rounded-xl border border-slate-200 bg-white">
  <p-table [value]="visibleRows()" [loading]="loading()" dataKey="id" tableStyleClass="min-w-3xl">
    <ng-template #caption>
      <input
        pInputText
        type="search"
        aria-label="Buscar roles"
        placeholder="Buscar por nombre…"
        [value]="filter()"
        (input)="filter.set($any($event.target).value)"
        class="w-full"
      />
    </ng-template>
    <ng-template #header>
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th class="w-40 text-right">Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-r>
      <tr>
        <td class="font-medium">{{ r.name }}</td>
        <td class="text-sm text-slate-600">{{ r.description || '—' }}</td>
        <td><app-status-tag [status]="r.status" /></td>
        <td>
          <div class="flex justify-end gap-1">
            <ng-container *appHasPermission="'PATCH /api/roles/:id'">
              <button
                pButton
                text
                rounded
                severity="secondary"
                aria-label="Editar rol"
                (click)="openEdit(r)"
              >
                <i pButtonIcon class="pi pi-pencil"></i>
              </button>
            </ng-container>
            <ng-container *appHasPermission="'PATCH /api/roles/:id/deactivate'">
              <button
                pButton
                text
                rounded
                severity="warn"
                aria-label="Baja lógica"
                (click)="deactivate(r)"
              >
                <i pButtonIcon class="pi pi-ban"></i>
              </button>
            </ng-container>
            <ng-container *appHasPermission="'DELETE /api/roles/:id'">
              <button
                pButton
                text
                rounded
                severity="danger"
                aria-label="Eliminar rol"
                (click)="remove(r)"
              >
                <i pButtonIcon class="pi pi-trash"></i>
              </button>
            </ng-container>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4">
          <app-empty-state
            icon="pi pi-tags"
            title="Sin roles"
            message="Crea el primero con «Nuevo rol»."
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  styleClass="w-full max-w-xl mx-4"
>
  <app-role-form
    [role]="editing()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>
