<app-page-header
  title="Recursos HTTP"
  subtitle="Catálogo de capacidades. El par (path, method) es único."
>
  @for (m of methods; track m.value) {
    @if ((countsByMethod().get(m.value) ?? 0) > 0) {
      <p-tag
        [value]="m.value + ': ' + (countsByMethod().get(m.value) ?? 0)"
        [severity]="methodSeverity(m.value)"
        [rounded]="true"
      />
    }
  }
  <ng-container *appHasPermission="'POST /api/recursos'">
    <button pButton type="button" (click)="openCreate()">
      <i pButtonIcon class="pi pi-plus"></i><span pButtonLabel>Nuevo recurso</span>
    </button>
  </ng-container>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<div class="mb-4 flex gap-2">
  <input
    pInputText
    type="search"
    aria-label="Buscar recursos"
    placeholder="Buscar por path o descripción…"
    [value]="filter()"
    (input)="filter.set($any($event.target).value)"
    class="flex-1"
  />
  <p-select
    [options]="[{ label: 'Todos', value: null }, ...methods]"
    optionLabel="label"
    optionValue="value"
    [ngModel]="methodFilter()"
    (onChange)="methodFilter.set($event.value)"
    placeholder="Método"
    [fluid]="true"
    styleClass="w-40"
  />
</div>

<div class="rounded-xl border border-slate-200 bg-white">
  <p-table [value]="visibleRows()" [loading]="loading()" dataKey="id" tableStyleClass="min-w-4xl">
    <ng-template #header>
      <tr>
        <th>Método</th>
        <th>Ruta</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th class="w-40 text-right">Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-r>
      <tr>
        <td><p-tag [value]="r.method" [severity]="methodSeverity(r.method)" [rounded]="true" /></td>
        <td class="font-mono text-xs">{{ r.path }}</td>
        <td class="text-sm text-slate-600">{{ r.description || '—' }}</td>
        <td><app-status-tag [status]="r.status" /></td>
        <td>
          <div class="flex justify-end gap-1">
            <ng-container *appHasPermission="'PATCH /api/recursos/:id'">
              <button
                pButton
                text
                rounded
                severity="secondary"
                aria-label="Editar recurso"
                pTooltip="Editar recurso"
                (click)="openEdit(r)"
              >
                <i pButtonIcon class="pi pi-pencil"></i>
              </button>
            </ng-container>
            <ng-container *appHasPermission="'PATCH /api/recursos/:id/deactivate'">
              <button
                pButton
                text
                rounded
                severity="warn"
                aria-label="Baja lógica"
                pTooltip="Baja lógica"
                (click)="deactivate(r)"
              >
                <i pButtonIcon class="pi pi-ban"></i>
              </button>
            </ng-container>
            <ng-container *appHasPermission="'DELETE /api/recursos/:id'">
              <button
                pButton
                text
                rounded
                severity="danger"
                aria-label="Eliminar recurso"
                pTooltip="Eliminar recurso"
                (click)="remove(r)"
              >
                <i pButtonIcon class="pi pi-trash"></i>
              </button>
            </ng-container>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="5">
          <app-empty-state
            icon="pi pi-database"
            title="Sin recursos"
            message="Crea el primero con «Nuevo recurso»."
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  styleClass="w-full max-w-xl mx-4"
>
  <app-resource-form
    [resource]="editing()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>
