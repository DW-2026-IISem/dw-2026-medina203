<app-page-header
  title="Asignaciones usuario ↔ rol"
  subtitle="Qué roles tiene cada usuario. Retirar es baja lógica."
>
  <p-tag [value]="rows().length + ' activas'" severity="info" [rounded]="true" />
  <ng-container *appHasPermission="'POST /api/asignaciones-rol'">
    <button pButton type="button" (click)="openCreate()">
      <i pButtonIcon class="pi pi-plus"></i><span pButtonLabel>Asignar rol</span>
    </button>
  </ng-container>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<div class="rounded-xl border border-slate-200 bg-white">
  <p-table [value]="rows()" [loading]="loading()" dataKey="id" tableStyleClass="min-w-3xl">
    <ng-template #header>
      <tr>
        <th>Usuario</th>
        <th>Rol</th>
        <th>Estado</th>
        <th class="w-32 text-right">Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-row>
      <tr>
        <td>{{ userName()(row.user_id) }}</td>
        <td><p-tag [value]="roleName()(row.role_id)" severity="info" [rounded]="true" /></td>
        <td><p-tag [value]="row.status" severity="secondary" [rounded]="true" /></td>
        <td>
          <div class="flex justify-end">
            <ng-container *appHasPermission="'PATCH /api/asignaciones-rol/:id/deactivate'">
              <button
                pButton
                text
                rounded
                severity="danger"
                aria-label="Retirar rol"
                pTooltip="Retirar"
                (click)="deactivate(row)"
              >
                <i pButtonIcon class="pi pi-times"></i>
              </button>
            </ng-container>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4">
          <app-empty-state
            icon="pi pi-user-plus"
            title="Sin asignaciones"
            message="Asigna el primer rol con «Asignar rol»."
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  header="Asignar rol"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="w-full max-w-lg mx-4"
>
  <div class="space-y-4">
    <div>
      <label for="ru-user" class="mb-1 block text-sm font-medium text-slate-700">Usuario</label>
      <p-select
        inputId="ru-user"
        [fluid]="true"
        [options]="users()"
        optionLabel="username"
        [filter]="true"
        filterBy="username,email"
        [ngModel]="selectedUser()"
        (ngModelChange)="selectedUser.set($event)"
      />
    </div>
    <div>
      <label for="ru-role" class="mb-1 block text-sm font-medium text-slate-700">Rol</label>
      <p-select
        inputId="ru-role"
        [fluid]="true"
        [options]="roles()"
        optionLabel="name"
        [filter]="true"
        [ngModel]="selectedRole()"
        (ngModelChange)="selectedRole.set($event)"
      />
    </div>
    <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
      <button
        pButton
        type="button"
        severity="secondary"
        outlined
        (click)="dialogVisible.set(false)"
      >
        <span pButtonLabel>Cancelar</span>
      </button>
      <button pButton type="button" [disabled]="!canSave()" (click)="save()">
        <i pButtonIcon class="pi pi-check"></i><span pButtonLabel>Asignar</span>
      </button>
    </div>
  </div>
</p-dialog>
