<header class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur">
  <div class="flex h-16 items-center gap-3 px-4 sm:px-6">
    <button
      pButton
      type="button"
      severity="secondary"
      [text]="true"
      [rounded]="true"
      aria-label="Mostrar u ocultar el menú"
      (click)="menuRequested.emit()"
    >
      <span pButtonIcon class="pi pi-bars"></span>
    </button>

    <a routerLink="/" class="flex items-center gap-2 text-slate-900">
      <i class="pi pi-sparkles text-xl text-teal-600"></i>
      <span class="text-lg font-semibold tracking-tight">TextilClean</span>
      <span class="hidden text-sm font-normal text-slate-400 sm:inline">Lavandería industrial</span>
    </a>

    @if (showSession()) {
      <div class="ml-auto flex items-center gap-2">
        <p-tag
          [value]="roleLabel()"
          severity="info"
          [rounded]="true"
          styleClass="hidden sm:inline-flex"
        />
        <button
          type="button"
          class="flex items-center gap-2 rounded-full p-1 hover:bg-slate-100"
          aria-label="Menú de usuario"
          aria-haspopup="true"
          (click)="userMenuPanel.toggle($event)"
        >
          <p-avatar [label]="initials()" shape="circle" styleClass="bg-teal-600 text-white" />
          <span class="hidden text-sm font-medium text-slate-700 sm:inline">{{ username() }}</span>
        </button>
        <p-menu #userMenuPanel [model]="userMenu()" [popup]="true" appendTo="body" />
      </div>
    }
  </div>
</header>
